name: Repo Cassette migrated artifact MIME scan
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe migrated artifact MIME
        uses: actions/github-script@v8
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const path = require('node:path');
            const {pathToFileURL} = require('node:url');
            await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'migrate-scan.mjs')).href);
