name: Repo Cassette migrated artifact MIME scan
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe migrated artifact MIME
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node migrate-scan.mjs
