name: Repo Cassette artifact name alias scan
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const path = require('path');
            const scan = require(path.join(process.env.GITHUB_WORKSPACE, 'name-alias-scan.js'));
            await scan({context});
